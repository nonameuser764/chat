<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Trò Chuyện Realtime</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            background-color: #0084ff;
            color: #ffffff;
            padding: 16px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #f9f9f9;
        }
        
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        
        .message.received {
            align-self: flex-start;
            background-color: #e4e6eb;
            color: #050505;
            border-bottom-left-radius: 4px;
        }
        
        .message.sent {
            align-self: flex-end;
            background-color: #0084ff;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        
        .chat-input-container {
            display: flex;
            padding: 12px;
            background: #ffffff;
            border-top: 1px solid #e5e5e5;
            gap: 8px;
        }
        
        .chat-input-container input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 0.95rem;
        }
        
        .chat-input-container input:focus {
            border-color: #0084ff;
        }
        
        .chat-input-container button {
            background-color: #0084ff;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .chat-input-container button:hover {
            background-color: #006bce;
        }
    </style>
</head>

<body>

    <div class="chat-container">
        <div class="chat-header">Phòng Trò Chuyện Chung</div>
        <div class="chat-messages" id="chatMessages"></div>
        <form class="chat-input-container" id="chatForm">
            <input type="text" id="messageInput" placeholder="Nhập tin nhắn..." autocomplete="off" required>
            <button type="submit">Gửi</button>
        </form>
    </div>

    <!-- Nhúng thư viện Socket.io Client từ Server -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); // Tự động kết nối tới server hiện tại

        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const chatMessages = document.getElementById('chatMessages');

        // Hàm thêm tin nhắn vào giao diện
        function appendMessage(text, type) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', type);
            messageElement.textContent = text;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Khi bấm gửi tin nhắn
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const messageText = messageInput.value.trim();

            if (messageText !== '') {
                // Gửi nội dung tin nhắn lên server qua sự kiện 'chatMessage'
                socket.emit('chatMessage', messageText);
                messageInput.value = '';
            }
        });

        // Lắng nghe sự kiện server phát tin nhắn về cho tất cả mọi người
        socket.on('chatMessage', (msg) => {
            // Phân biệt tin nhắn: Nếu muốn biết ai gửi, ta có thể quy ước thêm. 
            // Ở đây tạm thời hiển thị kiểu tin nhắn đến/đi dựa trên thao tác.
            // Để đơn giản, ta phân loại nhận (received). 
            // (Nếu tự mình gửi thì giao diện đã hiển thị ở form submit, hoặc có thể gộp chung cơ chế ID sau).
            appendMessage(msg, 'received');
        });
    </script>
</body>

</html>
